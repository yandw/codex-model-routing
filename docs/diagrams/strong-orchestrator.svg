<svg width="1440" height="840" viewBox="0 0 1440 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Mode A · Strong Orchestrator</title>
<desc id="desc">GPT-6 routing baseline. Workers return results and read-only advisors return advice to Root. Root retains scheduling and final acceptance. Runtime unverified.</desc>
<defs><marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker><style>.title{font:700 30px Arial,sans-serif;fill:#0f172a}.sub{font:400 16px Arial,sans-serif;fill:#64748b}.h{font:700 18px Arial,sans-serif;fill:#0f172a}.m{font:600 16px Arial,sans-serif;fill:#2563eb}.t{font:400 16px Arial,sans-serif;fill:#475569}.box{stroke-width:1.5;rx:16;ry:16}.line{stroke:#94a3b8;stroke-width:1.7;fill:none;marker-end:url(#arr)}.advice{stroke-dasharray:6 5}</style></defs>
<rect width="1440" height="840" fill="#f8fafc"/>
<text x="720" y="48" text-anchor="middle" class="title">Mode A · Strong Orchestrator</text>
<text x="720" y="79" text-anchor="middle" class="sub">One Root owns planning, routing, integration, and acceptance. Choose roles directly.</text>
<rect x="390" y="110" width="660" height="118" fill="#eff6ff" stroke="#93c5fd" class="box"/>
<text x="720" y="146" text-anchor="middle" class="h">Root: GPT-6.1 Sol / high</text>
<text x="720" y="177" text-anchor="middle" class="m">Optional: GPT-6 Astra / high</text>
<text x="720" y="206" text-anchor="middle" class="t">Record one selected Root profile.</text>
<path d="M720 228 L720 270" class="line"/>
<text x="720" y="304" text-anchor="middle" class="h">Execution difficulty · Decision uncertainty · Failure cost · Verifiability</text>
<path d="M720 320 L195.0 369" class="line"/>
<rect x="35" y="373" width="320" height="196" fill="#ffffff" stroke="#cbd5e1" class="box"/>
<text x="195.0" y="411" text-anchor="middle" class="h">LOCAL / JUDGMENT</text>
<text x="195.0" y="443" text-anchor="middle" class="h">Root</text>
<text x="195.0" y="475" text-anchor="middle" class="m">Selected Root profile</text>
<text x="195.0" y="510" text-anchor="middle" class="t">Small work when economical</text>
<text x="195.0" y="540" text-anchor="middle" class="t">Architecture and decisions</text>
<path d="M195.0 569 L195.0 603 L720 603 L720 633" class="line"/>
<path d="M720 320 L545.0 369" class="line"/>
