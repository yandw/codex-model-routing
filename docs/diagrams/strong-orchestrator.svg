<text x="545.0" y="443" text-anchor="middle" class="h">luna-worker</text>
<text x="545.0" y="475" text-anchor="middle" class="m">GPT-6 Luna / max</text>
<text x="545.0" y="510" text-anchor="middle" class="t">Bounded, verifiable work</text>
<text x="545.0" y="540" text-anchor="middle" class="t">Delegate when worthwhile</text>
<path d="M545.0 569 L545.0 603 L720 603 L720 633" class="line"/>
<path d="M720 320 L895.0 369" class="line"/>
<rect x="735" y="373" width="320" height="196" fill="#ffffff" stroke="#cbd5e1" class="box"/>
<text x="895.0" y="411" text-anchor="middle" class="h">COMPLEX EXECUTION</text>
<text x="895.0" y="443" text-anchor="middle" class="h">sol-worker</text>
<text x="895.0" y="475" text-anchor="middle" class="m">GPT-6.1 Sol / medium</text>
<text x="895.0" y="510" text-anchor="middle" class="t">Bounded scope</text>
<text x="895.0" y="540" text-anchor="middle" class="t">Cross-file reasoning</text>
<path d="M895.0 569 L895.0 603 L720 603 L720 633" class="line"/>
<path d="M720 320 L1245.0 369" class="line advice"/>
<rect x="1085" y="373" width="320" height="196" fill="#f5f3ff" stroke="#c4b5fd" class="box"/>
<text x="1245.0" y="411" text-anchor="middle" class="h">MAJOR JUDGMENT</text>
<text x="1245.0" y="443" text-anchor="middle" class="h">astra-advisor</text>
<text x="1245.0" y="475" text-anchor="middle" class="m">GPT-6 Astra / high</text>
<text x="1245.0" y="510" text-anchor="middle" class="t">Read-only · Sol Root only</text>
<text x="1245.0" y="540" text-anchor="middle" class="t">High-cost ambiguity</text>
<path d="M1245.0 569 L1245.0 603 L720 603 L720 633" class="line advice"/>
<rect x="300" y="636" width="840" height="91" fill="#eff6ff" stroke="#93c5fd" class="box"/>
<text x="720" y="672" text-anchor="middle" class="h">Results / advice return to Root</text>
<text x="720" y="703" text-anchor="middle" class="t">Root selects any follow-up executor, checks evidence, integrates, and accepts.</text>
<text x="720" y="762" text-anchor="middle" class="t">Astra Root handles frontier judgment directly; no routine same-tier advisor.</text>
<text x="720" y="798" text-anchor="middle" class="sub">Solid: execution / results · Dashed: consultation / advice · Runtime unverified</text>
</svg>
